services:
  n8n:
    container_name: n8n
    image: n8nio/n8n:2.45.3
    restart: always
   # ports:
   #   - "5678:5678"
    env_file:
      - .env
    volumes:
      - /path/in/your/stack/data:/home/node/.n8n
      - /path/in/your/stack/files:/files
    depends_on:
      - postgres
    networks: 
      - default
      - frontend #your traefik network
    labels: #your traefik network labels if needed
      - traefik.enable=true
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=cloudflare
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.service=n8n
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.routers.n8n.rule=Host(`n8n.yourdomain.com`)
      - traefik.docker.network=frontend #your traefik network
  postgres:
    container_name: n8n-postgres
    image: postgres:16
    restart: always
    networks: 
      - default
    env_file:
      - .env
    volumes:
      - /path/in/your/stack/postgres-data:/var/lib/postgresql/data
networks:
  default:
  frontend: #your traefik network
    external: true
